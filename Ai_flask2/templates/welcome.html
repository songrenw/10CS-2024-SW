{% extends 'base.html' %}
{% block title %}Welcome{% endblock %}
{% block content %}
<div class="w3-container w3-round-xxlarge w3-display-middle" style="background-color:rgba(0,0,0,0.51); color: #ffffff;">
    <div class="w3-center">
<h1><b> Hello {{ user }},</b></h1> <!-- display username using session -->
<h1><b>welcome to SongrenAI app </b></h1>
<form action="/select_model" method="POST"> <!-- form for /select model -->
    <br>
    <label for="route">choose model:</label>
    <select class="w3-select w3-animate-input" id="route" name="route" style="width:20%; max-width: 200px;">
        <option value="/chatgpt">chatgpt</option>
        <option value="/llama">llama 3.1</option>
        <option value="/llama2">llama 2(use less resource)</option>
        <option value="/gemini">Gemini 1.5 flash</option>
    </select>
    <br>
    <button class=button type="submit">Enter</button>
</form>
<br>
<form action="/logout" method="get">
    <button class = "button" type="submit">Logout</button>
</form>
    </div>
<br>
{% endblock %}
